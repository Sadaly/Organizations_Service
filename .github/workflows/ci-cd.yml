name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Organizations_Service.sln

jobs:
  # CI: build and tests on every push
  test:
    name: Build & test
    runs-on: ubuntu-latest   # Docker is preinstalled, so Testcontainers can start PostgreSQL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test OrganizationsService.Unittests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory ./TestResults

      - name: Integration tests (Testcontainers + PostgreSQL)
        run: >
          dotnet test OrganizationsService.IntegrationsTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  # CD: Docker image to GitHub Container Registry
  docker:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Organizations_Service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR requires lowercase image names 
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # CD: deploy to Render
  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
      IMAGE: ${{ needs.docker.outputs.image }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          image=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE"], safe=""))')
          curl --fail-with-body -sS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${image}"
          echo "Deploy of ${IMAGE} triggered"

      - name: Smoke test /health
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.APP_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${APP_URL%/}/health" | grep -q Healthy; then echo "OK"; exit 0; fi
            sleep 10
          done
          echo "The app did not report Healthy on /health" && exit 1

      - name: Deploy skipped
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL is not set - image ${IMAGE} was pushed to GHCR, deploy skipped."